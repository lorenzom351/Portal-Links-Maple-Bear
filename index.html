<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Central de Acessos da comunidade escolar Maple Bear e ABA.">
    <meta name="theme-color" content="#ffffff">
    <title>Acessos - ABA Maple Bear</title>

    <link rel="icon" type="image/png" sizes="32x32" href="Imagens/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="Imagens/favicon-192.png">
    <link rel="apple-touch-icon" href="Imagens/apple-touch-icon.png">

    <link rel="preload" as="font" type="font/woff2" href="fonts/poppins-500.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/poppins-600.woff2" crossorigin>

    <link rel="preload" as="image" href="Imagens/logo-maple-bear.webp" type="image/webp">
    <link rel="preload" as="image" fetchpriority="high"
          imagesrcset="Imagens/hero/circulo-800.webp 800w, Imagens/hero/circulo-1280.webp 1280w, Imagens/hero/circulo-1920.webp 1920w, Imagens/hero/circulo-2560.webp 2560w, Imagens/hero/circulo-3840.webp 3840w"
          imagesizes="100vw">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <header class="site-header">
        <div class="site-header__inner">

            <div class="brand">
                <img class="brand__aba" src="Imagens/logo-aba.svg" width="1809" height="556" alt="ABA">
                <span class="brand__divider" aria-hidden="true"></span>
                <img class="brand__maple" src="Imagens/logo-maple-bear.webp" width="900" height="324" alt="Maple Bear Canadian School, Canadian Elementary School e Canadian High School">
            </div>

            <nav class="site-nav" aria-label="Principal">
                <ul class="site-nav__list">
                    <li>
                        <a class="site-nav__link site-nav__link--primary" href="#plataformas">
                            <span>Nossas plataformas</span>
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>

    <main id="conteudo">
        <h1 class="sr-only">Acessos - ABA Maple Bear</h1>

        <section id="plataformas" class="platforms" aria-labelledby="plataformas-titulo">
            <div class="platforms__inner">
                <header class="platforms__header">
                    <h2 id="plataformas-titulo" class="platforms__title">Nossas plataformas</h2>
                </header>

                <!-- Os cards são gerados por cards.js a partir de platforms.js -->
                <ul id="plataformas-lista" class="platforms__grid">
                    <noscript><li class="platforms__noscript">Ative o JavaScript do navegador para ver as plataformas.</li></noscript>
                </ul>
            </div>
        </section>

        <section class="hero" aria-label="Boas-vindas">
            <!--
                Fotos decorativas em rotação (alt vazio). Só a primeira carrega com a página;
                as demais são carregadas por script.js pouco antes de aparecerem.
                Para trocar/adicionar: duplique um <img>, aponte data-srcset para os arquivos
                em Imagens/hero e ajuste o enquadramento em --slide-focus.
            -->
            <div class="hero__media" aria-hidden="true">
                <img class="hero__slide is-active" style="--slide-focus: 50% 55%"
                     srcset="Imagens/hero/circulo-800.webp 800w, Imagens/hero/circulo-1280.webp 1280w, Imagens/hero/circulo-1920.webp 1920w, Imagens/hero/circulo-2560.webp 2560w, Imagens/hero/circulo-3840.webp 3840w"
                     sizes="100vw" width="2560" height="1707" alt="" fetchpriority="high" decoding="async">

                <img class="hero__slide" style="--slide-focus: 50% 50%"
                     data-srcset="Imagens/hero/bear-games-800.webp 800w, Imagens/hero/bear-games-1280.webp 1280w, Imagens/hero/bear-games-1920.webp 1920w, Imagens/hero/bear-games-2560.webp 2560w, Imagens/hero/bear-games-3840.webp 3840w"
                     width="2560" height="1707" alt="" decoding="async">

                <img class="hero__slide" style="--slide-focus: 50% 35%"
                     data-srcset="Imagens/hero/trilha-800.webp 800w, Imagens/hero/trilha-1280.webp 1280w, Imagens/hero/trilha-1920.webp 1920w, Imagens/hero/trilha-2560.webp 2560w, Imagens/hero/trilha-3840.webp 3840w"
                     width="2560" height="1707" alt="" decoding="async">

                <img class="hero__slide" style="--slide-focus: 50% 85%"
                     data-srcset="Imagens/hero/barco-800.webp 800w, Imagens/hero/barco-1280.webp 1280w, Imagens/hero/barco-1920.webp 1920w, Imagens/hero/barco-2560.webp 2560w, Imagens/hero/barco-3840.webp 3840w"
                     width="2560" height="1871" alt="" decoding="async">

                <img class="hero__slide" style="--slide-focus: 50% 30%"
                     data-srcset="Imagens/hero/noite-800.webp 800w, Imagens/hero/noite-1280.webp 1280w, Imagens/hero/noite-1920.webp 1920w, Imagens/hero/noite-2560.webp 2560w, Imagens/hero/noite-3840.webp 3840w"
                     width="2560" height="1702" alt="" decoding="async">
            </div>

            <div class="hero__inner">
                <p class="hero__text">Acesse as plataformas e ferramentas que fazem parte da nossa comunidade escolar.</p>
            </div>
        </section>
    </main>

    <script src="platforms.js" defer></script>
    <script src="icons.js" defer></script>
    <script src="logos.js" defer></script>
    <script src="cards.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
